{{- $fullName := include "accounts.fullname" . -}}
{{- $component := "media" -}}
{{- $subcomponent := "service" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-media
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accounts.common.labels" (list . $component $subcomponent) | nindent 4 }}
  annotations:
    {{- toYaml $.Values.serviceMedia.annotations | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ $.Values.serviceMedia.host }}
